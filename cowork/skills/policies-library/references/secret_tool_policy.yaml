secret_plugin_policy:
  default_secret_access: deny
  path_policy:
    deny_read:
    - .env
    - .env.*
    - '**/*.pem'
    - '**/*.key'
    - '**/*.p12'
    - '**/*.pfx'
    - secrets/**
    - .aws/**
    - .kube/**
    - .docker/config.json
    allow_read:
    - .env.example
    - '*.example.yaml'
    - docs/**
  command_policy:
    deny_if_matches:
    - cat .env
    - printenv
    - (^|[;&| ])env($|[ ;&|])
    - (^|[;&| ])set($|[ ;&|])
    - kubectl get secret
    - aws configure list
    - grep -R .*PASSWORD
    - grep -R .*TOKEN
    - grep -R .*DATABASE_URL
  output_policy:
    redact_patterns:
    - postgres://[^\s]+
    - mysql://[^\s]+
    - mongodb(?:\+srv)?://[^\s]+
    - (?i)(password|token|secret|api_key)=([^\s]+)
    - '-----BEGIN [A-Z ]+ PRIVATE KEY-----'
  artifact_policy:
    scan_before_zip: true
    fail_if_secret_detected: true
  approval_policy:
    integration_with_runtime_secret: required
    production_secret_context: required
    secret_reference_write: allowed
    real_secret_write: denied
