$schema: "https://json-schema.org/draft/2020-12/schema"
title: RiskScore
kind: documentation_schema
properties:
 process_risk_score:
 type: object
 required: [total]
 properties:
 evidence_gap: { type: integer, minimum: 0, maximum: 20 }
 ambiguity_or_contract_gap: { type: integer, minimum: 0, maximum: 15 }
 domain_complexity: { type: integer, minimum: 0, maximum: 10 }
 architecture_or_surface_impact: { type: integer, minimum: 0, maximum: 15 }
 security_privacy_compliance_impact: { type: integer, minimum: 0, maximum: 15 }
 research_need_or_freshness_risk: { type: integer, minimum: 0, maximum: 10 }
 validation_gap: { type: integer, minimum: 0, maximum: 15 }
 total: { type: integer, minimum: 0, maximum: 100 }
 level: { enum: [low, guarded, medium, high, critical] }
 execution_risk_score:
 type: object
 required: [normalized_total]
 properties:
 file_mutation: { type: integer, minimum: 0, maximum: 10 }
 git_mutation: { type: integer, minimum: 0, maximum: 15 }
 external_system_mutation: { type: integer, minimum: 0, maximum: 20 }
 destructive_or_irreversible_action: { type: integer, minimum: 0, maximum: 20 }
 secret_or_credential_exposure: { type: integer, minimum: 0, maximum: 20 }
 production_or_shared_environment_impact: { type: integer, minimum: 0, maximum: 20 }
 dependency_or_supply_chain_impact: { type: integer, minimum: 0, maximum: 15 }
 untrusted_command_or_script_execution: { type: integer, minimum: 0, maximum: 15 }
 unknown_blast_radius: { type: integer, minimum: 0, maximum: 15 }
 rollback_unclear: { type: integer, minimum: 0, maximum: 10 }
 raw_total: { type: integer, minimum: 0 }
 normalized_total: { type: integer, minimum: 0, maximum: 100 }
 level: { enum: [not_applicable, low, guarded, medium, high, critical] }
